services:
  db:
    image: postgres:18.1
    volumes:
      - postgres-intershop:/var/lib/postgresql
    environment:
      POSTGRES_DB: intershop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: "db"
      DB_PORT: "5432"
      DB_NAME: "intershop"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    depends_on:
      - db

volumes:
  postgres-intershop:
