services:
  db:
    image: postgres:18.6-alpine
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:8.8.4-alpine
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    ports:
      - "${KC_HTTP_PORT}:${KC_HTTP_PORT}"
      - "${KC_HTTP_MANAGEMENT_PORT}:${KC_HTTP_MANAGEMENT_PORT}"
    environment:
      KC_HTTP_PORT: ${KC_HTTP_PORT}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
    command:
      - start-dev
      - --import-realm
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 30s

  payment-service:
    build: ./payment-service
    ports:
      - "8081:8081"
    env_file:
      - ./.env
    environment:
      KC_HTTP_HOST: "keycloak"
    depends_on:
      keycloak:
        condition: service_healthy

  mvc-app:
    build: ./mvc-app
    ports:
      - "8080:8080"
    env_file:
      - ./.env
    environment:
      POSTGRES_HOST: "db"
      REDIS_HOST: "redis"
      PAYMENT_HOST: "payment-service"
      KC_HTTP_HOST: "keycloak"
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      keycloak:
        condition: service_healthy
      payment-service:
        condition: service_started

volumes:
  postgres_data:
  keycloak_data:
