services:
  db:
    image: postgres:18.1
    volumes:
      - postgres:/var/lib/postgresql
    environment:
      POSTGRES_DB: intershop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  redis:
    image: redis:8.6.1-alpine
    ports:
      - "6379:6379"

  payment-service:
    build: ./payment-service
    ports:
      - "8081:8081"

  mvc-app:
    build: ./mvc-app
    ports:
      - "8080:8080"
    environment:
      DB_HOST: "db"
      DB_PORT: 5432
      DB_NAME: "intershop"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REDIS_HOST: "redis"
      REDIS_PORT: 6379
      PAYMENT_HOST: "payment-service"
      PAYMENT_PORT: 8081

    depends_on:
      - db
      - redis
      - payment-service

volumes:
  postgres:
