databaseChangeLog:
  - changeSet:
      id: 001-create-items
      author: Alexey Tsedyakov
      changes:
        - createTable:
            tableName: items
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: varchar
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar
              - column:
                  name: price
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: image
                  type: varchar