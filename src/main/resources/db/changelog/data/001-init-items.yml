databaseChangeLog:
  - changeSet:
      id: 001-init-items
      author: Alexey Tsedyakov
      changes:
        - loadData:
            tableName: items
            file: db/data/items.csv
            relativeToChangelogFile: false
            columns:
              - column:
                  name: name
                  type: varchar
              - column:
                  name: description
                  type: varchar
              - column:
                  name: price
                  type: int
              - column:
                  name: image
                  type: varchar
      rollback:
        - delete:
            tableName: order_items
        - delete:
            tableName: orders
        - delete:
            tableName: items