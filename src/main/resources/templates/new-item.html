<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Новый товар</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="main-header">
    <h1>Новый товар</h1>
    <nav class="main-navigation">
        <ul>
            <li><a th:href="@{/items}">Все товары</a></li>
            <li><a th:href="@{/cart}">Корзина</a></li>
            <li><a th:href="@{/orders}">Заказы</a></li>
            <li><a th:href="@{/items/new}">Добавить товар</a></li>
        </ul>
    </nav>
</header>

<main>
    <form class="new-item-form" method="post" th:action="@{/items}" th:object="${item}" enctype="multipart/form-data">
        <label>
            Имя:
            <input type="text" th:field="*{name}" required>
            <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="error"></span>
        </label>
        <label>
            Картинка:
            <input type="file" name="imageFile" accept="image/*" required>
        </label>
        <label>
            Описание:
            <textarea th:field="*{description}" rows="2"></textarea>
            <span th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="error"></span>
        </label>
        <label>
            Цена:
            <input type="number" th:field="*{price}" step="0.01" required>
            <span th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="error"></span>
        </label>

        <button type="submit">Добавить товар</button>
    </form>
</main>
</body>
</html>
