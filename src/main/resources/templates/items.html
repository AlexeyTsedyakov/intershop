<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Витрина товаров</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
<header class="main-header">
    <h1>Витрина товаров</h1>
    <nav class="main-navigation">
        <ul>
            <li><a th:href="@{/items}">Все товары</a></li>
            <li><a th:href="@{/cart}">Корзина</a></li>
        </ul>
    </nav>
</header>

<main>
    <form method="get" th:action="@{/items}" class="controls-form">
        <input type="hidden" name="page" value="0"/>

        <fieldset>
            <legend>Фильтр</legend>
            <label for="search">Название содержит:</label>
            <input id="search" name="search" type="search" th:value="${search}" placeholder="Например: кофе">
        </fieldset>

        <fieldset>
            <legend>Сортировка</legend>
            <label for="sort">Сортировать:</label>
            <select id="sort" name="sort">
                <option value="" th:selected="${sort == null || sort == ''}">По умолчанию</option>
                <option value="price,asc" th:selected="${sort == 'price,asc'}">Цена ↑</option>
                <option value="price,desc" th:selected="${sort == 'price,desc'}">Цена ↓</option>
                <option value="name,asc" th:selected="${sort == 'name,asc'}">Название A→Я</option>
                <option value="name,desc" th:selected="${sort == 'name,desc'}">Название Я→A</option>
            </select>
        </fieldset>

        <fieldset>
            <legend>Отображение</legend>
            <label for="size">Показывать:</label>
            <select id="size" name="size">
                <option value="3" th:selected="${size == 3}">3</option>
                <option value="10" th:selected="${size == 10}">10</option>
                <option value="20" th:selected="${size == 20}">20</option>
                <option value="50" th:selected="${size == 50}">50</option>
            </select>
        </fieldset>

        <button type="submit" class="submit-button">Применить</button>
    </form>

    <section class="items-container">
        <article class="item-card" th:each="item : ${items}">
            <img th:src="@{/img/{filename}(filename=${item.image})}" th:alt="${item.name}" width="300" height="300">
            <a th:href="@{/items/{id} (id=${item.id})}">
                <h2 th:text="${item.name}">Название товара</h2>
            </a>
            <p th:text="${item.description}">Описание</p>
            <p class="price" th:text="'Цена: ' + ${item.price}">Цена</p>
            <div class="cart-actions">
                <form method="post" th:action="@{/cart/increase/{id} (id=${item.id})}">
                    <button type="submit" class="cart-button">+</button>
                </form>
                <span th:text="${cart.getQuantity(item.id)}"></span>
                <form method="post" th:action="@{/cart/decrease/{id} (id=${item.id})}">
                    <button type="submit" class="cart-button">-</button>
                </form>
            </div>
        </article>
    </section>

    <div class="pagination-selector">
        <label>Страница: </label>
        <ul class="pagination-refs">
            <li th:if="${currentPage > 0}">
                <a th:href="@{/items(page=${currentPage - 1}, size=${size}, sort=${sort}, search=${search})}">&laquo;</a>
            </li>

            <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                th:if="${i >= currentPage - 2 && i <= currentPage + 2}"
                th:classappend="${i == currentPage} ? 'active' : ''">
                <a th:href="@{/items(page=${i}, size=${size}, sort=${sort}, search=${search})}"
                   th:text="${i + 1}"></a>
            </li>

            <li th:if="${currentPage < totalPages - 1}">
                <a th:href="@{/items(page=${currentPage + 1}, size=${size}, sort=${sort}, search=${search})}">&raquo;</a>
            </li>
        </ul>
    </div>
</main>
</body>
</html>
