spring.application.name=intershop
spring.config.import=optional:file:../.env[.properties]

spring.r2dbc.url=r2dbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
spring.r2dbc.username=${POSTGRES_USER}
spring.r2dbc.password=${POSTGRES_PASSWORD}

spring.liquibase.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
spring.liquibase.user=${POSTGRES_USER}
spring.liquibase.password=${POSTGRES_PASSWORD}

spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yml
spring.liquibase.enabled=true

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

spring.devtools.livereload.enabled=true

upload.image.path=upload/image

payment.api.base-url=http://${PAYMENT_HOST}:${PAYMENT_PORT}/api

spring.security.oauth2.client.registration.mvc-app.provider=keycloak
spring.security.oauth2.client.registration.mvc-app.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.mvc-app.client-id=mvc-app
spring.security.oauth2.client.registration.mvc-app.client-secret=${KC_CLIENT_SECRET}
spring.security.oauth2.client.registration.mvc-app.scope=openid

spring.security.oauth2.client.provider.keycloak.issuer-uri=http://${KC_HTTP_HOST}:${KC_HTTP_PORT}/realms/master