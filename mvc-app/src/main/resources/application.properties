spring.application.name=intershop

spring.r2dbc.url=r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:intershop}
spring.r2dbc.username=${POSTGRES_USER:postgres}
spring.r2dbc.password=${POSTGRES_PASSWORD:postgres}

spring.liquibase.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:intershop}
spring.liquibase.user=${POSTGRES_USER:postgres}
spring.liquibase.password=${POSTGRES_PASSWORD:postgres}

spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yml
spring.liquibase.enabled=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

spring.devtools.livereload.enabled=true

upload.image.path=upload/image