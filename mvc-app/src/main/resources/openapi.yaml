openapi: 3.1.0

info:
  title: Payment-service
  description: Intershop Payment-service
  version: 1.0.0

servers:
  - url: 'http://localhost:8081/api'

paths:
  /balance:
    get:
      tags:
        - balance
      summary: Получение баланса на счете
      responses:
        "200":
          description: Успешный ответ
          $ref: '#/components/responses/balanceResponse'
        "500":
          description: Внутренняя ошибка сервера
          $ref: '#/components/responses/baseResponse'

  /payments:
    post:
      tags:
        - payment
      summary: Проведение оплаты (списание с баланса)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/paymentRequest'
      responses:
        "200":
          description: Успешный ответ
          $ref: '#/components/responses/baseResponse'
        "400":
          description: Оплата не прошла, неверный запрос
          $ref: '#/components/responses/baseResponse'
        "500":
          description: Внутренняя ошибка сервера
          $ref: '#/components/responses/baseResponse'

components:
  schemas:
    paymentRequest:
      type: integer
      format: int64
    baseResponse:
      type: object
      properties:
        ok:
          type: boolean
        description:
          type: string

  responses:
    balanceResponse:
      description: Ответ с балансом счета
      content:
        application/json:
          schema:
            type: integer
            format: int64
    baseResponse:
      description: Стандартный ответ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/baseResponse'
