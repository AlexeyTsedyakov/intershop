<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Новый товар</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/holiday.css@0.11.5" />
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="main-header">
    <nav class="main-navigation">
        <ul>
            <li><a th:href="@{/items}">Все товары</a></li>
            <li th:if="${isAuthenticated}"><a th:href="@{/cart}">Корзина</a></li>
            <li th:if="${isAuthenticated}"><a th:href="@{/orders}">Заказы</a></li>
            <li th:if="${isAuthenticated}"><a th:href="@{/items/new}">Добавить товар</a></li>
            <li th:if="${!isAuthenticated}"><a th:href="@{/login}">Вход</a></li>
            <li th:if="${!isAuthenticated}"><a th:href="@{/users/registration}">Регистрация</a></li>
            <li th:if="${isAuthenticated}"><a th:href="@{/logout}">Выход</a></li>
        </ul>
    </nav>
</header>

<main>
    <h1>Витрина товаров</h1>

    <form class="new-item-form" method="post" th:action="@{/items}" th:object="${item}" enctype="multipart/form-data">
        <label>
            Имя:
            <input type="text" th:field="*{name}" required>
            <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="error"></span>
        </label>
        <label>
            Картинка:
            <input type="file" name="imageFile" accept="image/*" required>
        </label>
        <label>
            Описание:
            <textarea th:field="*{description}" rows="2"></textarea>
            <span th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="error"></span>
        </label>
        <label>
            Цена:
            <input type="number" th:field="*{price}" step="0.01" required>
            <span th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="error"></span>
        </label>

        <button type="submit">Добавить товар</button>
    </form>
</main>
</body>
</html>
