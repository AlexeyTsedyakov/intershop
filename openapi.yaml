openapi: 3.1.0

info:
  title: Payment-service
  description: Intershop Payment-service
  version: 1.0.0

servers:
  - url: 'http://localhost:8081/api'

paths:
  /balance:
    get:
      tags:
        - balance
      summary: Получение баланса на счете
      parameters:
        - $ref: '#/components/parameters/userId'
      responses:
        "200":
          description: Успешный ответ
          $ref: '#/components/responses/balanceResponse'
        "500":
          description: Внутренняя ошибка сервера
          $ref: '#/components/responses/baseResponse'

  /payments:
    post:
      tags:
        - payment
      summary: Проведение оплаты (списание с баланса)
      requestBody:
        $ref: '#/components/requestBodies/paymentRequest'
      responses:
        "200":
          description: Успешный ответ
          $ref: '#/components/responses/baseResponse'
        "400":
          description: Оплата не прошла, неверный запрос
          $ref: '#/components/responses/baseResponse'
        "500":
          description: Внутренняя ошибка сервера
          $ref: '#/components/responses/baseResponse'

components:
  schemas:
    paymentRequest:
      type: object
      required:
        - userId
        - amount
      properties:
        userId:
          type: integer
          format: int64
          description: Идентификатор пользователя
        amount:
          type: integer
          format: int64
          description: Сумма платежа

    baseResponse:
      type: object
      properties:
        ok:
          type: boolean
          description: Флаг успеха операции
        message:
          type: string
          description: Описание результата

  parameters:
    userId:
      name: userId
      in: query
      required: true
      description: Идентификатор пользователя
      schema:
        type: integer
        format: int64

  requestBodies:
    paymentRequest:
      description: Запрос на проведение оплаты
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/paymentRequest'

  responses:
    baseResponse:
      description: Стандартный ответ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/baseResponse'

    balanceResponse:
      description: Ответ с балансом счета
      content:
        application/json:
          schema:
            type: integer
            format: int64