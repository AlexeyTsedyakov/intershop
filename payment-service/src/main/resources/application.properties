spring.application.name=payment-service
spring.config.import=optional:file:../.env[.properties]

server.port=${PAYMENT_PORT}

spring.jackson.date-format=org.intershop.payment.RFC3339DateFormat
spring.jackson.datatype.datetime.WRITE_DATES_AS_TIMESTAMPS=false

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://${KC_HTTP_HOST}:${KC_HTTP_PORT}/realms/${KC_REALM}

config.init-balance=10000